name: Desktop build

# Builds directly runnable Lumina Studio desktop packages for
# Windows on x86-64 and ARM64.
#
# How a package is assembled (see docs/desktop-packaging.md):
#   1. frontend  — the React app is built once (arch-independent).
#   2. desktop   — one independent job per platform: api_server.py is
#                  frozen with PyInstaller (packaging/build_backend.py),
#                  smoke-tested with the backend's own self-test commands
#                  plus a /api/health round-trip, then electron-builder
#                  wraps the Electron shell with the frozen backend and
#                  the built frontend as resources.
#
# Platform notes:
#   * Windows ARM64 ships a native ARM64 Electron shell with an x64
#     backend: OpenCV (opencv-python) and the pinned native 3MF/SVG packages publish no
#     win-arm64 wheels, and the x64 backend runs under Windows-on-ARM
#     emulation. The backend leg therefore uses the x64 Python.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.id }})
    # One job per platform end to end (backend build -> Electron package):
    # legs are fully independent, and the backend bundle never
    # round-trips through artifact storage.
    needs: [frontend]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-latest
            python-arch: x64
            build-args: ""
            builder-args: --win --x64
          - id: windows-arm64
            runner: windows-11-arm
            # x64 Python on purpose: the bundled backend runs emulated
            # (see the header note); there are no win-arm64 wheels for
            # opencv-python / fatcat-metadata / neroued-3mf / lumina-svg-core.
            python-arch: x64
            build-args: ""
            builder-args: --win --arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12 (${{ matrix.python-arch }})
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}

      - name: Build and smoke-test backend bundle
        shell: bash
        run: |
          set -o pipefail
          python packaging/build_backend.py ${{ matrix.build-args }} 2>&1 | tee "$RUNNER_TEMP/backend-build.log"

      - name: Report backend build failure
        if: failure()
        shell: bash
        run: |
          {
            echo '## Backend build log (last 150 lines)'
            echo '```text'
            tail -n 150 "$RUNNER_TEMP/backend-build.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Mirror the decisive lines into job annotations so the failure
          # is readable through the API without the log viewer: the echoed
          # commands plus error-looking lines, then the log tail.
          grep -E '^\[build_backend\] \+|ERROR|Error|error:|Could not|No such|not found|Failed' \
            "$RUNNER_TEMP/backend-build.log" | tail -n 14 | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
            echo "::error title=backend-log-key::$esc"
          done
          tail -n 12 "$RUNNER_TEMP/backend-build.log" | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
            echo "::error title=backend-log-tail::$esc"
          done

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml

      - name: Install Electron dependencies
        run: pnpm --dir electron install --frozen-lockfile

      - name: Run Electron unit tests
        run: pnpm --dir electron test

      - name: Build desktop package
        run: pnpm --dir electron exec electron-builder --config electron-builder.yml ${{ matrix.builder-args }} --publish never

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: |
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.tar.gz
            electron/dist/*.dmg
            electron/dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download all desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

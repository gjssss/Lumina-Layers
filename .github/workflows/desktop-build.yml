name: Desktop build

# Builds directly runnable Lumina Studio desktop packages for
# Windows / Linux / macOS on both x86-64 and ARM64.
#
# How a package is assembled (see docs/desktop-packaging.md):
#   1. frontend  — the React app is built once (arch-independent).
#   2. backend   — api_server.py is frozen per platform with PyInstaller
#                  (packaging/build_backend.py) and smoke-tested with the
#                  backend's own self-test commands plus a /api/health
#                  round-trip before it is allowed into a package.
#   3. package   — electron-builder wraps the Electron shell with the
#                  frozen backend and the built frontend as resources.
#
# Platform notes:
#   * Windows ARM64 ships a native ARM64 Electron shell with an x64
#     backend: SciPy and the pinned native 3MF/SVG packages publish no
#     win-arm64 wheels, and the x64 backend runs under Windows-on-ARM
#     emulation. The backend leg therefore uses the x64 Python.
#   * Linux ARM64 and Intel macOS build the pinned native packages from
#     their published source distributions (no wheels exist for those
#     platforms); Linux ARM64 additionally builds lumina-svg-core from
#     source and needs the Rust toolchain installed below.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "ci/desktop-build-test"  # TEMPORARY: CI verification branch, removed after the first green run

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  backend:
    name: Backend (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-latest
            python-arch: x64
            build-args: ""
          - id: windows-arm64
            runner: windows-11-arm
            # x64 Python on purpose: the bundled backend runs emulated
            # (see the header note); there are no win-arm64 wheels for
            # SciPy / fatcat-metadata / neroued-3mf / lumina-svg-core.
            python-arch: x64
            build-args: ""
          - id: linux-x64
            runner: ubuntu-22.04
            python-arch: x64
            build-args: ""
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            python-arch: arm64
            build-args: "--source-native --svg-core-source"
          - id: macos-arm64
            runner: macos-15
            python-arch: arm64
            build-args: ""
          - id: macos-x64
            runner: macos-15-intel
            python-arch: x64
            build-args: "--source-native"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12 (${{ matrix.python-arch }})
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}

      - name: Set up Rust (lumina-svg-core source build)
        if: matrix.id == 'linux-arm64'
        uses: dtolnay/rust-toolchain@stable

      - name: Build and smoke-test backend bundle
        run: python packaging/build_backend.py ${{ matrix.build-args }}

      - name: Upload backend bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.id }}
          path: packaging/dist/lumina-backend
          if-no-files-found: error

  package:
    name: Package (${{ matrix.id }})
    needs: [frontend, backend]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-latest
            builder-args: --win --x64
          - id: windows-arm64
            runner: windows-11-arm
            builder-args: --win --arm64
          - id: linux-x64
            runner: ubuntu-22.04
            builder-args: --linux --x64
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            builder-args: --linux --arm64
          - id: macos-arm64
            runner: macos-15
            builder-args: --mac --arm64
          - id: macos-x64
            runner: macos-15-intel
            builder-args: --mac --x64
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download backend bundle
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.id }}
          path: packaging/dist/lumina-backend

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml

      - name: Install Electron dependencies
        run: pnpm --dir electron install --frozen-lockfile

      - name: Run Electron unit tests
        run: pnpm --dir electron test

      - name: Build desktop package
        run: pnpm --dir electron exec electron-builder --config electron-builder.yml ${{ matrix.builder-args }} --publish never

      - name: Smoke-test packaged backend (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(ls electron/dist/*.AppImage | head -n 1)"
          chmod +x "$appimage"
          workdir="$(mktemp -d)"
          (cd "$workdir" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          backend="$workdir/squashfs-root/resources/backend/lumina-backend"
          test -x "$backend"
          test -f "$workdir/squashfs-root/resources/frontend/index.html"
          "$backend" --svg-hole-compensation-self-test

      - name: Smoke-test packaged backend (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(ls -d electron/dist/mac*/Lumina\ Studio.app | head -n 1)"
          backend="$app/Contents/Resources/backend/lumina-backend"
          test -x "$backend"
          test -f "$app/Contents/Resources/frontend/index.html"
          "$backend" --svg-hole-compensation-self-test

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: |
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.tar.gz
            electron/dist/*.dmg
            electron/dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download all desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

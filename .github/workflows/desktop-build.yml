name: Desktop build

# Builds directly runnable Lumina Studio desktop packages for
# Windows / Linux / macOS on both x86-64 and ARM64.
#
# How a package is assembled (see docs/desktop-packaging.md):
#   1. frontend  — the React app is built once (arch-independent).
#   2. backend   — api_server.py is frozen per platform with PyInstaller
#                  (packaging/build_backend.py) and smoke-tested with the
#                  backend's own self-test commands plus a /api/health
#                  round-trip before it is allowed into a package.
#   3. package   — electron-builder wraps the Electron shell with the
#                  frozen backend and the built frontend as resources.
#
# Platform notes:
#   * Windows ARM64 ships a native ARM64 Electron shell with an x64
#     backend: OpenCV (opencv-python) and the pinned native 3MF/SVG packages publish no
#     win-arm64 wheels, and the x64 backend runs under Windows-on-ARM
#     emulation. The backend leg therefore uses the x64 Python.
#   * Linux ARM64 and Intel macOS build the pinned native packages from
#     source (no wheels exist for those platforms): fatcat-metadata and
#     neroued-3mf via the repository's own pinned-source wheel builder,
#     neroued-vectorizer from its sdist; Linux ARM64 additionally builds
#     lumina-svg-core from its sdist.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "ci/desktop-build-test"  # TEMPORARY: CI verification branch, removed after the first green run

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  backend:
    name: Backend (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-latest
            python-arch: x64
            build-args: ""
          - id: windows-arm64
            runner: windows-11-arm
            # x64 Python on purpose: the bundled backend runs emulated
            # (see the header note); there are no win-arm64 wheels for
            # opencv-python / fatcat-metadata / neroued-3mf / lumina-svg-core.
            python-arch: x64
            build-args: ""
          - id: linux-x64
            runner: ubuntu-22.04
            python-arch: x64
            build-args: ""
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            python-arch: arm64
            build-args: "--source-native --svg-core-source"
          - id: macos-arm64
            runner: macos-15
            python-arch: arm64
            build-args: ""
          - id: macos-x64
            runner: macos-15-intel
            python-arch: x64
            # constraints pin numba/llvmlite/rawpy to the last versions
            # with Intel macOS wheels (see the constraints file header)
            build-args: "--source-native --constraints packaging/constraints-macos-x64.txt"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12 (${{ matrix.python-arch }})
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}

      # neroued-vectorizer's CMake build does find_package(OpenCV 4.5)
      # and requires libpotrace; neither is provided by any pip wheel
      # (opencv-python ships no CMake config). These are exactly the
      # system packages the package's own CI installs
      # (ci/install-deps-macos.sh: brew install opencv potrace; the Linux
      # script builds the same two libraries from source — Ubuntu 24.04's
      # libopencv-dev 4.6 / libpotrace-dev satisfy them directly).
      - name: Install vectorizer system dependencies (Linux ARM64)
        if: matrix.id == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev libpotrace-dev

      - name: Install vectorizer system dependencies (Intel macOS)
        if: matrix.id == 'macos-x64'
        run: brew install opencv potrace

      - name: Build and smoke-test backend bundle
        shell: bash
        run: |
          set -o pipefail
          python packaging/build_backend.py ${{ matrix.build-args }} 2>&1 | tee "$RUNNER_TEMP/backend-build.log"

      - name: Report backend build failure
        if: failure()
        shell: bash
        run: |
          {
            echo '## Backend build log (last 150 lines)'
            echo '```text'
            tail -n 150 "$RUNNER_TEMP/backend-build.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Mirror the decisive lines into job annotations so the failure
          # is readable through the API without the log viewer: the echoed
          # commands plus error-looking lines, then the log tail.
          grep -E '^\[build_backend\] \+|ERROR|Error|error:|Could not|No such|not found|Failed' \
            "$RUNNER_TEMP/backend-build.log" | tail -n 14 | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
            echo "::error title=backend-log-key::$esc"
          done
          tail -n 12 "$RUNNER_TEMP/backend-build.log" | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
            echo "::error title=backend-log-tail::$esc"
          done

      - name: Upload backend bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.id }}
          path: packaging/dist/lumina-backend
          if-no-files-found: error

  package:
    name: Package (${{ matrix.id }})
    needs: [frontend, backend]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-latest
            builder-args: --win --x64
          - id: windows-arm64
            runner: windows-11-arm
            builder-args: --win --arm64
          - id: linux-x64
            runner: ubuntu-22.04
            builder-args: --linux --x64
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            builder-args: --linux --arm64
          - id: macos-arm64
            runner: macos-15
            builder-args: --mac --arm64
          - id: macos-x64
            runner: macos-15-intel
            builder-args: --mac --x64
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download backend bundle
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.id }}
          path: packaging/dist/lumina-backend

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml

      - name: Install Electron dependencies
        run: pnpm --dir electron install --frozen-lockfile

      - name: Run Electron unit tests
        run: pnpm --dir electron test

      - name: Build desktop package
        run: pnpm --dir electron exec electron-builder --config electron-builder.yml ${{ matrix.builder-args }} --publish never

      - name: Smoke-test packaged backend (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(ls electron/dist/*.AppImage | head -n 1)"
          chmod +x "$appimage"
          workdir="$(mktemp -d)"
          (cd "$workdir" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          backend="$workdir/squashfs-root/resources/backend/lumina-backend"
          test -x "$backend"
          test -f "$workdir/squashfs-root/resources/frontend/index.html"
          "$backend" --svg-hole-compensation-self-test

      - name: Smoke-test packaged backend (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(ls -d electron/dist/mac*/Lumina\ Studio.app | head -n 1)"
          backend="$app/Contents/Resources/backend/lumina-backend"
          test -x "$backend"
          test -f "$app/Contents/Resources/frontend/index.html"
          "$backend" --svg-hole-compensation-self-test

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: |
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.tar.gz
            electron/dist/*.dmg
            electron/dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download all desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
